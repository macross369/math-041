                ]
            }
        ];

        let unitUrls = {};
        let completedUnits = {};
        let expandedSubsections = {};
        let currentFilter = 'all';

        window.addEventListener('DOMContentLoaded', () => {
            loadSavedData();
            renderUnits();
            updateProgressStats();
        });

        function loadSavedData() {
            try {
                const savedUrls = localStorage.getItem('math4a_unit_urls');
                if (savedUrls) {
                    unitUrls = JSON.parse(savedUrls);
                } else {
                    unitsData.forEach(u => {
                        unitUrls[u.id] = u.defaultUrl;
                        if (u.subsections) {
                            u.subsections.forEach(sub => {
                                unitUrls[sub.id] = sub.defaultUrl;
                            });
                        }
                    });
                }

                const savedCompleted = localStorage.getItem('math4a_completed_units');
                if (savedCompleted) {
                    completedUnits = JSON.parse(savedCompleted);
                }
            } catch (e) {
                console.error("Local storage error", e);
            }
        }

        function saveData() {
            localStorage.setItem('math4a_unit_urls', JSON.stringify(unitUrls));
            localStorage.setItem('math4a_completed_units', JSON.stringify(completedUnits));
        }

        function renderUnits() {
            const grid = document.getElementById('unitsGrid');
            grid.innerHTML = '';

            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtered = unitsData.filter(unit => {
                const matchesCat = (currentFilter === 'all') || (unit.category === currentFilter);
                const matchesSearch = unit.title.toLowerCase().includes(searchVal) || 
                                      unit.unitNum.toLowerCase().includes(searchVal) ||
                                      unit.desc.toLowerCase().includes(searchVal) ||
                                      unit.tags.some(t => t.toLowerCase().includes(searchVal)) ||
                                      (unit.subsections && unit.subsections.some(s => s.id.toLowerCase().includes(searchVal) || s.title.toLowerCase().includes(searchVal)));
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-3xl mb-2 opacity-50"></i>
                        <p>找不到符合條件的單元或小節</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(unit => {
                const isCompleted = !!completedUnits[unit.id];
                const isExpanded = !!expandedSubsections[unit.id];

                let subHtml = '';
                if (unit.subsections && unit.subsections.length > 0) {
                    subHtml = `
                        <div id="sub_section_${unit.id}" class="${isExpanded ? 'block' : 'hidden'} mt-3 pt-3 border-t border-white/10 transition-all">
                            <div class="text-[11px] font-bold text-emerald-300/90 mb-2 flex items-center justify-between">
                                <span><i class="fa-solid fa-layer-group mr-1"></i>小節學習頁面：</span>
                            </div>
                            <div class="grid grid-cols-2 gap-1.5">
                                ${unit.subsections.map(sub => {
                                    const subUrl = unitUrls[sub.id] || sub.defaultUrl;
                                    return `
                                        <a href="${subUrl}" target="_blank" title="${sub.id} ${sub.title}" 
                                           class="px-2 py-1.5 bg-slate-900/90 hover:bg-emerald-500/20 text-emerald-200 hover:text-white border border-white/10 hover:border-emerald-400/50 rounded-lg transition-all flex flex-col justify-center group/sub">
                                            <span class="text-[10px] font-extrabold text-emerald-400 group-hover/sub:text-emerald-300">${sub.id}</span>
                                            <span class="truncate w-full text-[11px] font-medium text-slate-300 group-hover/sub:text-white">${sub.title}</span>
                                        </a>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                }

                const card = document.createElement('div');
                card.className = `glass-card rounded-2xl p-5 flex flex-col justify-between relative overflow-hidden group ${isCompleted ? 'border-emerald-500/40 bg-slate-900/40' : ''}`;

                card.innerHTML = `
                    <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br ${unit.color} opacity-10 rounded-bl-full pointer-events-none group-hover:opacity-20 transition-opacity"></div>
                    
                    <div>
                        <!-- Header / Unit Number -->
                        <div class="flex items-center justify-between mb-3">
                            <span class="px-2.5 py-1 rounded-lg text-xs font-bold border ${unit.badgeColor}">
                                ${unit.unitNum}
                            </span>
                            <button onclick="toggleCompleted('${unit.id}')" title="切換完成狀態" class="flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full transition-all ${isCompleted ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-400/30' : 'bg-slate-800 text-slate-400 hover:text-slate-200 border border-white/5'}">
                                <i class="fa-solid ${isCompleted ? 'fa-circle-check text-emerald-400' : 'fa-circle'}"></i>
                                <span>${isCompleted ? '已標記完成' : '標記完成'}</span>
                            </button>
                        </div>

                        <!-- Title & Icon -->
                        <div class="flex items-start gap-3 mb-3">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-br ${unit.color} flex items-center justify-center text-white text-lg shadow-md shrink-0 mt-0.5">
                                <i class="fa-solid ${unit.icon}"></i>

                            </div>

                        <!-- Tags -->
                        <div class="flex flex-wrap gap-1.5 mb-3 mt-2">
                            ${unit.tags.map(tag => `<span class="text-[11px] bg-slate-900/60 text-slate-300 px-2 py-0.5 rounded-md border border-white/5"># ${tag}</span>`).join('')}

        function toggleSubsections(unitId) {
            expandedSubsections[unitId] = !expandedSubsections[unitId];
            const subElem = document.getElementById(`sub_section_${unitId}`);
            if (subElem) {
                if (expandedSubsections[unitId]) {
                    subElem.classList.remove('hidden');
                    subElem.classList.add('block');
                } else {
                    subElem.classList.add('hidden');
                    subElem.classList.remove('block');
                }
            }
        }

        function toggleCompleted(unitId) {
            completedUnits[unitId] = !completedUnits[unitId];
            saveData();
            renderUnits();
            updateProgressStats();
            showToast(completedUnits[unitId] ? "已將單元標記為完成！" : "已取消單元完成標記");
        }

        function updateProgressStats() {
            const mainUnits = unitsData.filter(u => typeof u.id === 'number');
            const total = mainUnits.length;
            const completedCount = mainUnits.filter(u => completedUnits[u.id]).length;
            const percent = Math.round((completedCount / total) * 100);

            document.getElementById('totalCount').innerText = total;
            document.getElementById('completedCount').innerText = completedCount;
            document.getElementById('progressText').innerText = `${percent}%`;

            const circle = document.getElementById('progressCircle');
            circle.setAttribute('stroke-dasharray', `${percent}, 100`);
        }

        function resetProgress() {
            completedUnits = {};
            saveData();
            renderUnits();
            updateProgressStats();
            showToast("學習紀錄已重置");
        }

        function setCategoryFilter(cat) {
            currentFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {

                    btn.className = "cat-btn active bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition-all shadow-md";
                } else {
                    btn.className = "cat-btn bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg font-medium transition-all";
                }
            });
            renderUnits();
        }

            document.getElementById('configModal').classList.add('hidden');
        }

        function saveUnitLinks() {
            unitsData.forEach(u => {
                const input = document.getElementById(`url_input_${u.id}`);
                if (input) {
                    unitUrls[u.id] = input.value.trim() || u.defaultUrl;
                }
                if (u.subsections) {
                    u.subsections.forEach(sub => {
                        const subInput = document.getElementById(`url_input_${sub.id}`);
                        if (subInput) {
                            unitUrls[sub.id] = subInput.value.trim() || sub.defaultUrl;
                        }
                    });
                }
            });
            saveData();
            renderUnits();
            closeConfigModal();
            showToast("單元與小節網址設定已儲存");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        function openPreview(unitId) {
            const unit = unitsData.find(u => String(u.id) === String(unitId));
            if (!unit) return;

            document.getElementById('previewUnitTitle').innerText = `${unit.unitNum}：${unit.title}`;

            const contentArea = document.getElementById('previewContent');
            contentArea.innerHTML = '';

            switch (unit.interactiveType) {
                case 'largeNumbers':
                    contentArea.innerHTML = renderLargeNumbersDemo();
                    initLargeNumbersLogic();
                    break;
                case 'multG4':
                    contentArea.innerHTML = renderMultG4Demo();
                    initMultG4Logic();
                    break;
                case 'anglesG4':
                    contentArea.innerHTML = renderAnglesG4Demo();
                    initAnglesG4Logic();
                    break;
                case 'fractionsG4':
                    contentArea.innerHTML = renderFractionsG4Demo();
                    initFractionsG4Logic();
                    break;
                case 'kilometerG4':
                    contentArea.innerHTML = renderKilometerG4Demo();
                    initKilometerG4Logic();

                case 'divG4':
                    contentArea.innerHTML = renderDivG4Demo();

                    break;

                default:

        function initLargeNumbersLogic() {
            const input = document.getElementById('largeNumInput');
            const randBtn = document.getElementById('largeNumRandBtn');

            const update = () => {
                let val = parseInt(input.value) || 0;
                if (val > 99999999) val = 99999999;
                if (val < 0) val = 0;

                const str = String(val).padStart(8, '0');
                for (let i = 0; i < 8; i++) {
                    const elem = document.getElementById(`d${7-i}`);
                    if (elem) elem.innerText = str[i];
                }

                const wanPart = Math.floor(val / 10000);
                const unitPart = val % 10000;

                let text = `<b>讀作：</b><span class="text-amber-300 font-bold">${wanPart>0?wanPart+'萬':''}${unitPart>0?unitPart:''}</span><br>`;
                text += `<b>結構分解：</b>${wanPart} 個萬 + ${unitPart} 個一`;

                document.getElementById('largeNumBreakdown').innerHTML = text;
            };

            if (input) input.oninput = update;
            if (randBtn) {
                randBtn.onclick = () => {
                    input.value = Math.floor(Math.random() * 90000000) + 10000000;
                    update();
                };
            }
            update();
        }

                    </div>

        function initMultG4Logic() {
            const aInput = document.getElementById('mG4NumA');
            const bInput = document.getElementById('mG4NumB');
            const randBtn = document.getElementById('mG4RandBtn');

            const calculate = () => {
                const a = parseInt(aInput.value) || 0;
                const b = parseInt(bInput.value) || 0;
                const ans = a * b;

                document.getElementById('mG4Ans').innerText = ans;

                let tipHtml = `<div class="font-bold text-teal-300 mb-1">直式計算步驟拆解：</div>`;
                tipHtml += `1. 精確結果：<span class="text-amber-300 font-bold">${a} × ${b} = ${ans}</span><br>`;
                tipHtml += `2. 末尾補0規律：若為 ${a} × ${b*10}，結果即為 <span class="text-cyan-300 font-bold">${ans*10}</span> (末尾多補1個0)。`;

                document.getElementById('mG4Tip').innerHTML = tipHtml;
            };

            if (aInput) aInput.oninput = calculate;
            if (bInput) bInput.oninput = calculate;
            if (randBtn) {
                randBtn.onclick = () => {
                    aInput.value = Math.floor(Math.random() * 800) + 120;
                    bInput.value = Math.floor(Math.random() * 80) + 12;
                    calculate();
                };
            }
            calculate();
        }

        function initAnglesG4Logic() {
            const range = document.getElementById('angleG4Range');
            const valText = document.getElementById('angleG4Text');
            const svg = document.getElementById('angleG4Svg');
            const info = document.getElementById('angleG4Info');

            const draw = () => {
                const deg = parseInt(range.value) || 0;
                valText.innerText = `${deg}°`;

                const rad = (deg * Math.PI) / 180;
                const r = 70;
                const cx = 120, cy = 100; // Center lowered to fit full circle

                const x1 = cx + r;
                const y1 = cy;
                const x2 = cx + r * Math.cos(-rad);
                const y2 = cy + r * Math.sin(-rad);

                let arcSvg = '';
                if (deg === 360) {
                    // Full circle for 360 degrees
                    arcSvg = `<circle cx="${cx}" cy="${cy}" r="25" fill="rgba(56,189,248,0.25)" stroke="#f59e0b" stroke-width="2"/>`;
                } else if (deg > 0) {
                    const largeArc = deg > 180 ? 1 : 0;
                    arcSvg = `<path d="M ${cx+25} ${cy} A 25 25 0 ${largeArc} 0 ${cx+25*Math.cos(-rad)} ${cy+25*Math.sin(-rad)}" fill="rgba(56,189,248,0.25)" stroke="#f59e0b" stroke-width="2"/>`;
                }

                // Top Protractor half
                let protractor = `<path d="M ${cx-80} ${cy} A 80 80 0 0 1 ${cx+80} ${cy} Z" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>`;
                
                // Bottom Protractor half when > 180 (or full 360)
                if (deg > 180 || deg === 360) {
                    protractor += `<path d="M ${cx-80} ${cy} A 80 80 0 0 0 ${cx+80} ${cy} Z" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>`;
                }

                svg.innerHTML = `
                    ${protractor}
                    <line x1="${cx}" y1="${cy}" x2="${x1}" y2="${y1}" stroke="#38bdf8" stroke-width="3"/>
                    <line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="#38bdf8" stroke-width="3"/>
                    <circle cx="${cx}" cy="${cy}" r="4" fill="#f59e0b"/>
                    ${arcSvg}
                `;

                let typeStr = "銳角";
                if (deg === 90) typeStr = "直角 (90°)";
                else if (deg > 90 && deg < 180) typeStr = "鈍角";
                else if (deg === 180) typeStr = "平角 (180°)";
                else if (deg > 180 && deg < 360) typeStr = "優角/旋轉角";
                else if (deg === 360) typeStr = "周角 (360°)";

                info.innerHTML = `角度：<b>${deg}°</b>，分類：<b class="text-amber-300">${typeStr}</b>`;
            };

            if (range) range.oninput = draw;
            draw();
        }

        let fgN = 11, fgD = 4;
        function changeFracG4(denD, numD) {
            fgD = Math.max(1, Math.min(12, fgD + denD));

        function initFractionsG4Logic() {
            window.updateFracG4View = () => {
                const whole = Math.floor(fgN / fgD);
                const rem = fgN % fgD;

                let visHtml = '';
                const totalCircles = Math.ceil(fgN / fgD);
                for (let c = 0; c < totalCircles; c++) {
                    const isFull = c < whole;
                    visHtml += `<div class="w-12 h-12 rounded-full ${isFull ? 'bg-blue-500' : 'bg-transparent border-2 border-blue-500'} flex items-center justify-center font-bold text-xs shadow-md overflow-hidden relative">`;
                    
                    if (isFull) {
                        visHtml += `<span class="text-white text-lg">1</span>`;
                    } else {
                        // Conic gradient to show fraction slice
                        const pct = (rem / fgD) * 100;
                        visHtml += `<div class="absolute inset-0 bg-blue-500 opacity-60" style="background: conic-gradient(currentColor ${pct}%, transparent 0);"></div>`;
                    }
                    visHtml += `</div>`;
                }
                document.getElementById('fG4Vis').innerHTML = visHtml;

                let typeStr = fgN < fgD ? "真分數" : (rem === 0 ? "整數" : "假分數 / 帶分數");
                let desc = `假分數：<div class="math-frac font-bold text-blue-300 align-middle inline-flex scale-90 mx-1"><span class="math-frac-num border-b-2 pb-[1px]">${fgN}</span><span class="math-frac-den pt-[1px]">${fgD}</span></div><br>`;

                    desc += `互換為帶分數：<div class="math-mixed text-amber-300 font-bold mx-1 text-lg"><span class="mr-1">${whole}</span><div class="math-frac text-sm"><span class="math-frac-num border-b-[2px] pb-[1px]">${rem}</span><span class="math-frac-den pt-[1px]">${fgD}</span></div></div> (${typeStr})`;
                } else if (rem === 0) {
                    desc += `化簡整數：<b class="text-emerald-300 text-lg mx-1">${whole}</b>`;
                } else {
                    desc += `分類：<b class="text-emerald-300">真分數</b>`;
                }
                document.getElementById('fG4Desc').innerHTML = desc;
            };
            window.updateFracG4View();
        }

        function initChartsG4Logic() {
            window.switchChartG4 = (type) => {
                const barGroup = document.getElementById('chartBarGroup');
                const lineGroup = document.getElementById('chartLineGroup');
                const btnBar = document.getElementById('btnChartBar');
                const btnLine = document.getElementById('btnChartLine');

                if (type === 'bar') {
                    barGroup.classList.remove('hidden');
                    lineGroup.classList.add('hidden');
                    btnBar.className = "px-3 py-1.5 bg-emerald-500 text-white rounded-lg text-xs font-bold transition-colors shadow-md";
                    btnLine.className = "px-3 py-1.5 bg-slate-800 text-slate-300 hover:bg-slate-700 rounded-lg text-xs font-bold transition-colors border border-white/5";
                } else {
                    barGroup.classList.add('hidden');
                    lineGroup.classList.remove('hidden');
                    btnLine.className = "px-3 py-1.5 bg-emerald-500 text-white rounded-lg text-xs font-bold transition-colors shadow-md";
                    btnBar.className = "px-3 py-1.5 bg-slate-800 text-slate-300 hover:bg-slate-700 rounded-lg text-xs font-bold transition-colors border border-white/5";
                }
            };
        }
    </script>
